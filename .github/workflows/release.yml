name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Check default npm version
        run: npm --version

      - name: Ensure npm >= 11.5.1 (required for OIDC Trusted Publishing)
        run: |
          current=$(npm --version)
          required="11.5.1"
          if [ "$(printf '%s\n' "$required" "$current" | sort -V | head -n1)" != "$required" ]; then
            echo "npm $current is below $required, upgrading..."
            npm install -g npm@11 --force
            npm --version
          else
            echo "npm $current is already >= $required"
          fi

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm turbo run build --filter='./packages/*'

      - name: Run tests
        run: pnpm turbo run test --filter='./packages/*'

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm release
          version: pnpm version-packages
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
