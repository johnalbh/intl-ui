name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install npm >= 11.5.1 for OIDC Trusted Publishing
        run: |
          mkdir -p "$HOME/.npm-global"
          npm install -g --prefix="$HOME/.npm-global" npm@11.5.1
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      - name: Verify npm version
        run: npm --version

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm turbo run build --filter='./packages/*'

      - name: Run tests
        run: pnpm turbo run test --filter='./packages/*'

      - name: Create Version PR (changesets)
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve workspace protocol for publishing
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          set -e
          # Get the actual version of @intl-ui/core
          core_version=$(node -p "require('./packages/core/package.json').version")
          echo "Resolved @intl-ui/core version: $core_version"

          # Replace workspace:* with real versions in publishable packages
          for pkg_dir in packages/core packages/react packages/angular; do
            pkg_json="$pkg_dir/package.json"
            if grep -q '"workspace:\*"' "$pkg_json"; then
              echo "Resolving workspace:* in $pkg_json"
              sed -i "s/\"workspace:\\*\"/\"^${core_version}\"/g" "$pkg_json"
            fi
            # Remove devDependencies with workspace protocol (not needed in publish)
            node -e "
              const fs = require('fs');
              const pkg = JSON.parse(fs.readFileSync('$pkg_json', 'utf8'));
              if (pkg.devDependencies) {
                for (const [k, v] of Object.entries(pkg.devDependencies)) {
                  if (String(v).includes('workspace:')) delete pkg.devDependencies[k];
                }
              }
              fs.writeFileSync('$pkg_json', JSON.stringify(pkg, null, 2) + '\n');
            "
          done

      - name: Verify no workspace protocol leaks
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          if grep -r '"workspace:' packages/*/package.json; then
            echo "ERROR: workspace: protocol found in package.json — would break npm consumers"
            exit 1
          fi
          echo "OK: no workspace: protocol leaks"

      - name: Publish to npm via OIDC Trusted Publishing
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          set -e
          for pkg_dir in packages/core packages/react packages/angular; do
            pushd "$pkg_dir" > /dev/null
            name=$(node -p "require('./package.json').name")
            version=$(node -p "require('./package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "[skip] $name@$version already on npm"
            else
              echo "[publish] $name@$version via OIDC..."
              npm publish --access public
            fi
            popd > /dev/null
          done

      - name: Deprecate broken versions (workspace:* leak)
        if: steps.changesets.outputs.hasChangesets == 'false'
        continue-on-error: true
        run: |
          # Deprecate each version individually to avoid batch 404
          for v in 1.0.2 1.0.3 1.0.4 1.0.5 1.0.6; do
            npm deprecate "@intl-ui/react@$v" "broken workspace:* dependency, use >=1.0.7" 2>/dev/null || true
          done
          for v in 1.0.2 1.0.3 1.0.4; do
            npm deprecate "@intl-ui/angular@$v" "broken workspace:* dependency, use >=1.0.5" 2>/dev/null || true
          done

      - name: Create GitHub Releases
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          set -e
          for pkg_dir in packages/core packages/react packages/angular; do
            name=$(node -p "require('./$pkg_dir/package.json').name")
            version=$(node -p "require('./$pkg_dir/package.json').version")
            tag="${name}@${version}"
            changelog="./$pkg_dir/CHANGELOG.md"

            # Skip if release already exists
            if gh release view "$tag" > /dev/null 2>&1; then
              echo "[skip] Release $tag already exists"
              continue
            fi

            # Skip if no CHANGELOG
            if [ ! -f "$changelog" ]; then
              echo "[skip] No CHANGELOG for $name"
              continue
            fi

            # Extract the latest version section from CHANGELOG.md
            body=$(awk "/^## ${version}$/,/^## /" "$changelog" | head -n -1 | tail -n +2)

            if [ -z "$body" ]; then
              body="Release ${name}@${version}"
            fi

            echo "[release] Creating $tag"
            gh release create "$tag" \
              --title "$tag" \
              --notes "$body" \
              --target main
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
