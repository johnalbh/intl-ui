name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install npm >= 11.5.1 for OIDC Trusted Publishing
        run: |
          mkdir -p "$HOME/.npm-global"
          npm install -g --prefix="$HOME/.npm-global" npm@11.5.1
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"

      - name: Verify npm version
        run: npm --version

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm turbo run build --filter='./packages/*'

      - name: Run tests
        run: pnpm turbo run test --filter='./packages/*'

      - name: Create Version PR (changesets)
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          title: 'chore: version packages'
          commit: 'chore: version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm via OIDC Trusted Publishing
        if: steps.changesets.outputs.hasChangesets == 'false'
        run: |
          set -e
          for pkg_dir in packages/core packages/react packages/angular; do
            pushd "$pkg_dir" > /dev/null
            name=$(node -p "require('./package.json').name")
            version=$(node -p "require('./package.json').version")
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "[skip] $name@$version already on npm"
            else
              echo "[publish] $name@$version via OIDC..."
              npm publish --access public
            fi
            popd > /dev/null
          done
