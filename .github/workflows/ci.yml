name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  # The publish job is intentionally omitted until @intl-ui/react ships.
  # Publishing @intl-ui/core alone would put a "data-only" package on npm
  # without the product it was built to support, which muddies the first
  # impression and wastes the one-shot launch attention.
  #
  # When ready to release (end of Phase 2):
  #   1. Create an npm org for the chosen scope (e.g. @intl-ui)
  #   2. Generate an Automation token on npm
  #   3. Add it as NPM_TOKEN in GitHub repository secrets
  #   4. Restore the publish job — see git history of this file for the
  #      previous configuration (changesets/action@v1 + pnpm release)
