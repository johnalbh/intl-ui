name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build React playground
        run: pnpm turbo run build --filter=@intl-ui/playground...
        env:
          GITHUB_PAGES: 'true'

      - name: Build Angular playground dependencies
        run: pnpm turbo run build --filter=@intl-ui/angular...

      - name: Build Angular playground
        run: pnpm --filter @intl-ui/playground-angular build:ghpages

      - name: Merge playgrounds into single site
        run: |
          mkdir -p _site
          cp -r apps/playground/dist/* _site/
          mkdir -p _site/angular
          cp -r apps/playground-angular/dist/browser/* _site/angular/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
